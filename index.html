<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دليل صيدليات تيزنيت</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Maps -->
  <script src="https://maps.googleapis.com/maps/api/js"></script>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="overlay">
    <h1>مرحبا بك في دليل صيدليات تيزنيت</h1>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">

  <!-- الصفحات -->
  <div id="home" class="screen active">
    <h2>🏥 دليل تيزنيت</h2>

    <div class="grid">
      <div onclick="openScreen('night')" class="card">💊<p>الحراسة</p></div>
      <div onclick="openScreen('weekend')" class="card">🕒<p>المداومة</p></div>
      <div onclick="openScreen('map')" class="card">📍<p>الخريطة</p></div>
      <div onclick="openScreen('doctors')" class="card">👨‍⚕️<p>الأطباء</p></div>
    </div>
  </div>

  <div id="night" class="screen">
    <h3>💊 صيدلية الحراسة</h3>
    <p>صيدلية السلام</p>
    <p>📞 0600000000</p>
  </div>

  <div id="weekend" class="screen">
    <h3>🕒 مداومة نهاية الأسبوع</h3>
    <p>صيدلية الأمل</p>
  </div>

  <div id="doctors" class="screen">
    <h3>👨‍⚕️ الأطباء</h3>
    <ul>
      <li>د. أحمد</li>
      <li>د. فاطمة</li>
    </ul>
  </div>

  <div id="map" class="screen">
    <h3>📍 الخريطة</h3>
    <div id="mapContainer"></div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button onclick="openScreen('home')">🏠</button>
    <button onclick="openScreen('night')">💊</button>
    <button onclick="openScreen('map')">📍</button>
    <button onclick="openScreen('doctors')">👨‍⚕️</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
