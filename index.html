<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دليل صيدليات تيزنيت</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="overlay">
    <h1>مرحبا بك في دليل صيدليات تيزنيت</h1>
  </div>
</div>

<!-- Main -->
<div id="main" class="hidden">

  <div class="header">
    <h2>🏥 دليل تيزنيت الصحي</h2>
  </div>

  <!-- القائمة -->
  <div id="menu">

    <div class="card" onclick="show('night')">
      💊
      <p>صيدلية الحراسة</p>
    </div>

    <div class="card" onclick="show('weekend')">
      🕒
      <p>مداومة نهاية الأسبوع</p>
    </div>

    <div class="card" onclick="show('pharmacies')">
      📋
      <p>الصيدليات</p>
    </div>

    <div class="card" onclick="show('doctors')">
      👨‍⚕️
      <p>الأطباء</p>
    </div>

  </div>

  <!-- المحتوى -->
  <div id="content" class="hidden">
    <button onclick="back()">⬅ رجوع</button>
    <div id="text"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
